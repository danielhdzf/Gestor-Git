name: Release

# Al subir una etiqueta como v0.1.0 se compilan los instaladores de Windows
# y se crea un borrador de release en GitHub con ellos adjuntos.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gestor Git ${{ github.ref_name }}
          releaseBody: |
            Instaladores para Windows:
            - `.exe` (recomendado): se instala solo para tu usuario, sin permisos de administrador.
            - `.msi`: instalación clásica de Windows.
          releaseDraft: true
